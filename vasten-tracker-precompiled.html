<script>
  // localStorage-backed replacement for window.storage, same call shape as the
  // Claude-artifact version so the rest of the app code is unchanged.
  window.storage = {
    async get(key) {
      try {
        const v = localStorage.getItem(key);
        return v !== null ? { key, value: v } : null;
      } catch (e) {
        throw e;
      }
    },
    async set(key, value) {
      try {
        localStorage.setItem(key, value);
        return { key, value };
      } catch (e) {
        throw e;
      }
    },
  };
</script>
